name: Build libModMenu.so
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          "$CXX" -shared -fPIC -O2 -std=c++17 -fvisibility=hidden -Wl,--gc-sections -Wl,-z,max-page-size=16384 -static-libstdc++ -s -o libModMenu.so Main.cpp -llog -ldl
          ls -la libModMenu.so
      - uses: actions/upload-artifact@v4
        with:
          name: libModMenu
          path: libModMenu.so
